<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="আমার হিসাব">
<meta name="theme-color" content="#1b5e20">
<title>আমার হিসাব</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, Arial, sans-serif; background: #f4f6f4; color: #222; padding-bottom: 80px; }
header { background: #1b5e20; color: #fff; padding: 18px; text-align: center; font-size: 20px; font-weight: bold; }
.screen { display: none; padding: 16px; }
.screen.active { display: block; }
.card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.card h3 { font-size: 14px; color: #666; margin-bottom: 6px; }
.big { font-size: 26px; font-weight: bold; }
.income { color: #2e7d32; }
.expense { color: #c62828; }
.saving { color: #1565c0; }
.bar { background: #ddd; border-radius: 10px; height: 18px; overflow: hidden; margin: 8px 0; }
.bar div { background: #2e7d32; height: 100%; width: 0%; transition: width 0.4s; }
label { display: block; margin: 12px 0 4px; font-size: 14px; color: #555; }
input, select { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
button.main { width: 100%; padding: 14px; margin-top: 16px; font-size: 17px; color: #fff; background: #1b5e20; border: none; border-radius: 10px; }
.item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
.item small { color: #888; display: block; }
.del { background: none; border: none; color: #c62828; font-size: 18px; padding: 6px; }
nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff; border-top: 1px solid #ddd; }
nav button { flex: 1; padding: 14px 4px; font-size: 13px; background: none; border: none; color: #666; }
nav button.active { color: #1b5e20; font-weight: bold; }
</style>
</head>
<body>
<header>আমার হিসাব</header>

<div id="home" class="screen active">
  <div class="card"><h3>এই মাসের আয়</h3><div class="big income" id="hIncome">৳ 0</div></div>
  <div class="card"><h3>এই মাসের খরচ</h3><div class="big expense" id="hExpense">৳ 0</div></div>
  <div class="card"><h3>এই মাসে জমা</h3><div class="big saving" id="hSaving">৳ 0</div></div>
  <div class="card">
    <h3>লক্ষ্যের অগ্রগতি</h3>
    <div class="bar"><div id="hBar"></div></div>
    <div id="hGoalText">লক্ষ্য ঠিক করা হয়নি</div>
  </div>
</div>

<div id="add" class="screen">
  <div class="card">
    <label>ধরন</label>
    <select id="type">
      <option value="income">আয়</option>
      <option value="expense">খরচ</option>
      <option value="saving">জমা</option>
    </select>
    <label>টাকার অঙ্ক (৳)</label>
    <input type="number" id="amount" inputmode="decimal" placeholder="যেমন 5000">
    <label>বিবরণ</label>
    <input type="text" id="note" placeholder="যেমন বেতন, খাবার">
    <label>তারিখ</label>
    <input type="date" id="date">
    <button class="main" onclick="addEntry()">সংরক্ষণ করো</button>
  </div>
</div>

<div id="list" class="screen">
  <div class="card" id="listBox"></div>
</div>

<div id="goal" class="screen">
  <div class="card">
    <label>লক্ষ্যের টাকা (৳)</label>
    <input type="number" id="goalAmount" inputmode="decimal" placeholder="যেমন 3000000">
    <label>কত বছরে</label>
    <input type="number" id="goalYears" inputmode="decimal" placeholder="যেমন 12">
    <button class="main" onclick="saveGoal()">লক্ষ্য সংরক্ষণ করো</button>
    <div id="goalInfo" style="margin-top:16px;line-height:1.6"></div>
  </div>
</div>

<nav>
  <button class="active" onclick="show('home',this)">হোম</button>
  <button onclick="show('add',this)">যোগ করো</button>
  <button onclick="show('list',this)">তালিকা</button>
  <button onclick="show('goal',this)">লক্ষ্য</button>
</nav>

<script>
var entries = JSON.parse(localStorage.getItem('entries') || '[]');
var goal = JSON.parse(localStorage.getItem('goal') || 'null');

function fmt(n) { return '৳ ' + Math.round(n).toLocaleString('bn-BD'); }
function save() { localStorage.setItem('entries', JSON.stringify(entries)); localStorage.setItem('goal', JSON.stringify(goal)); }

function show(id, btn) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('nav button').forEach(function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  render();
}

function addEntry() {
  var amount = parseFloat(document.getElementById('amount').value);
  if (!amount || amount <= 0) { alert('সঠিক টাকার অঙ্ক দাও'); return; }
  entries.push({
    id: Date.now(),
    type: document.getElementById('type').value,
    amount: amount,
    note: document.getElementById('note').value,
    date: document.getElementById('date').value || new Date().toISOString().slice(0, 10)
  });
  save();
  document.getElementById('amount').value = '';
  document.getElementById('note').value = '';
  alert('সংরক্ষণ হয়েছে');
  render();
}

function delEntry(id) {
  if (!confirm('মুছে ফেলবে?')) return;
  entries = entries.filter(function (e) { return e.id !== id; });
  save();
  render();
}

function saveGoal() {
  var a = parseFloat(document.getElementById('goalAmount').value);
  var y = parseFloat(document.getElementById('goalYears').value);
  if (!a || !y) { alert('টাকা আর বছর দুটোই দাও'); return; }
  goal = { amount: a, years: y };
  save();
  render();
}

function render() {
  var month = new Date().toISOString().slice(0, 7);
  var inc = 0, exp = 0, sav = 0, totalSav = 0;
  entries.forEach(function (e) {
    if (e.type === 'saving') totalSav += e.amount;
    if (e.date.slice(0, 7) === month) {
      if (e.type === 'income') inc += e.amount;
      if (e.type === 'expense') exp += e.amount;
      if (e.type === 'saving') sav += e.amount;
    }
  });
  document.getElementById('hIncome').textContent = fmt(inc);
  document.getElementById('hExpense').textContent = fmt(exp);
  document.getElementById('hSaving').textContent = fmt(sav);

  if (goal) {
    var pct = Math.min(100, totalSav / goal.amount * 100);
    document.getElementById('hBar').style.width = pct + '%';
    document.getElementById('hGoalText').textContent = 'মোট জমা ' + fmt(totalSav) + ' / লক্ষ্য ' + fmt(goal.amount) + ' (' + pct.toFixed(1) + '%)';
    var perMonth = goal.amount / (goal.years * 12);
    document.getElementById('goalInfo').innerHTML = 'লক্ষ্য: <b>' + fmt(goal.amount) + '</b> ' + goal.years + ' বছরে<br>মাসে জমাতে হবে প্রায় <b>' + fmt(perMonth) + '</b><br>এ পর্যন্ত জমা: <b>' + fmt(totalSav) + '</b><br>বাকি: <b>' + fmt(Math.max(0, goal.amount - totalSav)) + '</b>';
  }

  var sorted = entries.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
  var names = { income: 'আয়', expense: 'খরচ', saving: 'জমা' };
  var html = sorted.length ? '' : 'কোনো লেনদেন নেই';
  sorted.forEach(function (e) {
    html += '<div class="item"><div><b class="' + e.type + '">' + names[e.type] + '</b> ' + (e.note || '') + '<small>' + e.date + '</small></div><div><b class="' + e.type + '">' + fmt(e.amount) + '</b><button class="del" onclick="delEntry(' + e.id + ')">✕</button></div></div>';
  });
  document.getElementById('listBox').innerHTML = html;
}

document.getElementById('date').value = new Date().toISOString().slice(0, 10);
render();
</script>
